<!--
  Linker-zijbalk-menu (patroon geleend van Spil's .zijbalk, zie
  ~/projects/Spil/spil/templates/basis.html + static/stijl.css) --
  hier met energiedashboard's eigen kleuren/lettertype, geen nieuwe
  verzonnen. Wordt via een Jinja-include in zowel dashboard.html als
  handleiding.html en introductie.html geplakt (geen gedeelde
  basis-template aanwezig in dit project, dus bewust geen
  extends-refactor).

  Verwacht een variabele `actieve_pagina` ("dashboard" / "introductie" /
  "handleiding"), gezet met een set-statement vlak vóór de include --
  Jinja's include werkt "with context" (standaard), dus dat is
  voldoende, geen routewijziging nodig.

  Bijwerken: bij een nieuwe hoofdpagina hier een regel bijzetten, en het
  bijbehorende CLAUDE.md-onderdeel ("Introductie & Handleiding: bijwerken
  is een discipline") checken of hoofdstuk 2 van introductie.html ook een
  update nodig heeft.
-->
<style>
  /* Dezelfde donkere balk als Spil, maar met energiedashboard's eigen
     donkerteal (--inkt uit dashboard.html/handleiding.html se lichte
     stand, hier bewust als vaste kleur neergezet i.p.v. de var() die met
     het donker/licht-thema meeschakelt -- anders zou de zijbalk zelf in
     donkere modus juist lícht worden). Fraunces voor het merk, IBM Plex
     Sans voor de links: allebei al de bestaande lettertypes van dit
     dashboard, niets nieuws. */
  .ed-zijbalk {
    position: fixed; top: 0; left: 0; bottom: 0; width: 13rem;
    overflow-y: auto; background: #0F1E1C; color: rgba(255,255,255,.82);
    padding: 1.4rem 1.1rem; display: flex; flex-direction: column;
    z-index: 1030; box-sizing: border-box;
  }
  .ed-zijbalk-merk {
    font-family: "Fraunces", serif; font-weight: 600; font-size: 1.05rem;
    color: #fff; display: flex; align-items: center; gap: .5rem;
    margin: 0 0 1.7rem; letter-spacing: -.01em;
  }
  .ed-zijbalk-nav { display: flex; flex-direction: column; gap: .2rem; }
  .ed-zijbalk-link {
    display: flex; align-items: center; gap: .6rem; padding: .55rem .7rem;
    border-radius: 9px; color: rgba(255,255,255,.82); text-decoration: none;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: .87rem; font-weight: 500; transition: background .12s, color .12s;
  }
  .ed-zijbalk-link:hover { background: rgba(255,255,255,.09); color: #fff; }
  .ed-zijbalk-link.actief { background: #fff; color: var(--accent); font-weight: 700; }
  .ed-zijbalk-onder {
    margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,.15);
    font-size: .72rem; color: rgba(255,255,255,.45); line-height: 1.5;
  }

  /* Inhoud schuift op, zelfde principe als Spils .zijbalk-inhoud. Elke
     pagina behoudt zijn eigen .wrap (max-width + auto-centreren) daarbinnen. */
  .ed-inhoud-met-zijbalk { margin-left: 13rem; }
  @media (max-width: 767.98px) {
    .ed-zijbalk { width: 10.5rem; padding: 1.1rem .8rem; }
    .ed-zijbalk-merk { font-size: .92rem; margin-bottom: 1.2rem; }
    .ed-zijbalk-link { font-size: .8rem; padding: .5rem .55rem; }
    .ed-inhoud-met-zijbalk { margin-left: 10.5rem; }
  }
</style>
<nav class="ed-zijbalk" aria-label="Hoofdmenu">
  <div class="ed-zijbalk-merk">&#9889; Energiedashboard</div>
  <div class="ed-zijbalk-nav">
    <a class="ed-zijbalk-link {{ 'actief' if actieve_pagina == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}">&#128202; Dashboard</a>
    <a class="ed-zijbalk-link {{ 'actief' if actieve_pagina == 'introductie' else '' }}" href="{{ url_for('introductie') }}">&#128075; Introductie</a>
    <a class="ed-zijbalk-link {{ 'actief' if actieve_pagina == 'handleiding' else '' }}" href="{{ url_for('handleiding') }}">&#128214; Handleiding</a>
    <a class="ed-zijbalk-link {{ 'actief' if actieve_pagina == 'vragen' else '' }}" href="{{ url_for('vragen_overzicht') }}">&#128172; Vragen, Wensen &amp; Bevindingen</a>
  </div>
  <div class="ed-zijbalk-onder">P1-meter &middot; zon &middot; dynamisch tarief</div>
</nav>
