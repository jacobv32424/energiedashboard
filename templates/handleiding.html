<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handleiding &mdash; Energiedashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papier:#F2F6F4; --paneel:#FFFFFF; --inkt:#0F1E1C; --inkt-zacht:#54655F;
  --lijn:#DCE6E2; --accent:#1B6E6B; --schaduw: 0 1px 2px rgba(15,30,28,.04), 0 8px 24px rgba(15,30,28,.06);
}
:root[data-theme="dark"]{
  --papier:#0E1A19; --paneel:#152423; --inkt:#EAF2EF; --inkt-zacht:#93A6A0;
  --lijn:#233634; --accent:#4FBDB6; --schaduw: 0 1px 2px rgba(0,0,0,.2), 0 12px 28px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papier:#0E1A19; --paneel:#152423; --inkt:#EAF2EF; --inkt-zacht:#93A6A0;
    --lijn:#233634; --accent:#4FBDB6; --schaduw: 0 1px 2px rgba(0,0,0,.2), 0 12px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{margin:0; background:var(--papier); color:var(--inkt); font-family:"IBM Plex Sans",system-ui,sans-serif; line-height:1.6}
.wrap{max-width:760px; margin:0 auto; padding:28px 22px 60px}
.terug{display:inline-block; margin-bottom:18px; font-size:13px; color:var(--inkt-zacht); text-decoration:none}
.terug:hover{color:var(--accent)}
.paneel{background:var(--paneel); border:1px solid var(--lijn); border-radius:18px; padding:28px 32px; box-shadow:var(--schaduw)}
.paneel h1{font-family:"Fraunces",serif; font-weight:600; font-size:28px; margin:0 0 4px}
.paneel h2{font-family:"Fraunces",serif; font-weight:600; font-size:19px; margin:28px 0 8px; padding-top:14px; border-top:1px solid var(--lijn)}
.paneel h2:first-of-type{border-top:none; padding-top:0; margin-top:20px}
.paneel h3{font-size:15px; font-weight:600; margin:18px 0 6px}
.paneel p{font-size:14px; margin:0 0 12px}
.paneel ul, .paneel ol{font-size:14px; padding-left:22px; margin:0 0 12px}
.paneel li{margin-bottom:4px}
.paneel code{font-family:"IBM Plex Mono",monospace; background:var(--papier); padding:1px 5px; border-radius:4px; font-size:12.5px}
.paneel table{border-collapse:collapse; width:100%; font-size:13px; margin:0 0 14px}
.paneel table th, .paneel table td{padding:6px 10px; border-bottom:1px solid var(--lijn); text-align:left}
.paneel a{color:var(--accent)}
.toc{background:var(--papier); border:1px solid var(--lijn); border-radius:14px; padding:14px 22px 16px; margin:20px 0 24px; box-shadow:var(--schaduw)}
.toc ul{list-style:none; margin:5px 0; padding-left:0}
.toc > ul{padding-left:2px}
.toc > ul > li{margin:6px 0}
.toc ul ul{margin:5px 0 5px 14px; padding-left:12px; border-left:2px solid var(--lijn)}
.toc a{text-decoration:none; font-weight:600; font-size:14px}
.toc a::before{content:"›"; display:inline-block; width:1em; color:var(--accent); font-weight:700}
.toc ul ul a{font-weight:500; color:var(--inkt-zacht); font-size:13px}
.toc a:hover{text-decoration:underline}
.merk-badge{position:fixed; right:12px; bottom:12px; height:64px; opacity:.85; z-index:10}
</style>
</head>
<body>
<div class="wrap">
  <a class="terug" href="{{ url_for('dashboard') }}">&larr; Terug naar het dashboard</a>
  <div class="paneel">
    {{ inhoud | safe }}
  </div>
</div>
<img class="merk-badge" src="{{ url_for('static', filename='img/jacobs-creative-mind-badge.png') }}" alt="Jacob's Creative Mind">
<script>
const root = document.documentElement;
const opgeslagenThema = localStorage.getItem("energiedashboard-thema");
if (opgeslagenThema) root.setAttribute("data-theme", opgeslagenThema);
</script>
</body>
</html>
